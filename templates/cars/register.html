{% extends "base.html" %}

{% block title %}Criar conta - Your New Car{% endblock %}

{% block content %}
    <div class="col-md-9 col-xl-7 mx-auto">
        <h1 class="h3 mb-3">Criar uma conta</h1>

        <form method="post" class="card card-body">
            {% csrf_token %}
            {% include 'partials/_form_fields.html' %}
            <button type="submit" class="btn btn-primary w-100">Criar conta</button>
        </form>

        <p class="mt-3 text-center">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
    </div>
{% endblock %}
