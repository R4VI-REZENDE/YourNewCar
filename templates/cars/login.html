{% extends "base.html" %}

{% block title %}Entrar - Your New Car{% endblock %}

{% block content %}
    <div class="col-md-9 col-xl-7 mx-auto">
        <h1 class="h3 mb-3">Entrar na sua conta</h1>

        <form method="post" class="card card-body">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% include 'partials/_form_fields.html' %}
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <p class="mt-3 text-center">Ainda não tem conta? <a href="{% url 'register' %}">Cadastre-se</a></p>
    </div>
{% endblock %}
