<nav class="navbar navbar-expand-lg bg-black navbar-vinho">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="{% url 'car_list' %}">Your New Car</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'car_list' %}active{% endif %}"
                       href="{% url 'car_list' %}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'car_create' %}active{% endif %}"
                       href="{% url 'car_create' %}">Anunciar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'meus_anuncios' %}active{% endif %}"
                       href="{% url 'meus_anuncios' %}">Meus anúncios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'favoritos' %}active{% endif %}"
                       href="{% url 'favoritos' %}">Favoritos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'mensagens' %}active{% endif %}"
                       href="{% url 'mensagens' %}">
                        Mensagens
                        {% if mensagens_novas %}<span class="badge text-bg-primary">{{ mensagens_novas }}</span>{% endif %}
                    </a>
                </li>
            </ul>

            <div class="d-flex flex-wrap align-items-center gap-2">
                {% if user.is_authenticated %}
                    <span class="text-secondary small">Olá, {{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Entrar</a>
                    <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Cadastrar</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
